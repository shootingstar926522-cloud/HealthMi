name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build project
      run: |
        PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
        SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
        
        echo "Found project: $PROJECT_FILE"
        echo "Using scheme: $SCHEME_NAME"
        
        mkdir -p build/Payload
        
        xcodebuild -project "$PROJECT_FILE" \
                   -scheme "$SCHEME_NAME" \
                   -sdk iphonesimulator \
                   -derivedDataPath build/DerivedData \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build
        
        APP_PATH=$(find build/DerivedData -name "*.app" | head -n 1)
        if [ -d "$APP_PATH" ]; then
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r HealthMi_unsigned.ipa Payload
          echo "IPA_BUILT=true" >> $GITHUB_ENV
        else
          echo "App build failed to locate .app product"
          exit 1
        fi

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: HealthMi-IPA
        path: build/HealthMi_unsigned.ipa
